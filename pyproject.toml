[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "btlab"
version = "0.2.0"
description = "Walk-forward backtesting with honest statistics: transaction costs, block bootstrap, probabilistic and deflated Sharpe ratios"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adrien Liao" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]
data = ["yfinance"]

[tool.setuptools]
packages = ["btlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
